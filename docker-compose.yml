services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: investment-analysis-bot:latest
    container_name: investment-analysis-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/investment.db
      TZ: ${TZ:-UTC}
      # On foreign VPS leave PROXY_URL empty — Telegram API is reachable directly
      PROXY_URL: ${PROXY_URL:-}
    volumes:
      - bot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No ports needed — bot uses outbound long polling to Telegram

volumes:
  bot-data:
